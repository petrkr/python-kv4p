[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "python-kv4p"
version = "0.0.0"
description = "Python implementation of the KV4P-HT radio protocol"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
]
